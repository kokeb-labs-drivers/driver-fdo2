---
# FDO2 ESP32 examples: the app matrix read by the build scripts, the CI and the docs Examples page.
version: "1.0"

metadata:
  project: "ESP32 FDO2 Driver Examples"
  default_app: "fdo2_basic_example"
  target: "esp32c6"
  idf_versions: ["release/v5.5"]
  build_types: [["Debug", "Release"]]

apps:
  fdo2_basic_example:
    description: "Start the FDO2 from menuconfig values and log pO2 and temperature once a second"
    source_file: "fdo2_basic_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "ESP-IDF UART port with every optional hook"
      - "Config from Kconfig (menuconfig) through fdo2_kconfig.hpp"
      - "Every Result checked and logged by name"

  fdo2_nonblocking_example:
    description: "Measure without blocking: Start calls and Poll() from a task that does other work"
    source_file: "fdo2_nonblocking_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: false
    hardware_required: true
    features:
      - "BeginInitialize, StartMeasureOxygen and Poll()"
      - "The port's NowUs clock, so Poll() takes no argument"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_fdo2_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
