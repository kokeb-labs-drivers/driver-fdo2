<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="667" viewBox="0 0 1200 667" role="img" aria-labelledby="state-machine-title state-machine-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="state-machine-title">The driver's states</title>
<desc id="state-machine-desc">State diagram of fdo2::FDO2: Uninitialized, PoweringUp, Idle, Waiting, Streaming, Draining and StateUnknown, with the calls and events that move between them.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="666" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">NON-BLOCKING USE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The driver's states</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Poll() moves Waiting, Draining and PoweringUp forward; every other change is a call.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
<path d="M288 172.3 L374.2 172.3 Q379 172.3 379 177.1 L379 177.1 Q379 181.8 383.8 181.8 L470 181.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M730 181.8 L816.2 181.8 Q821 181.8 821 177.1 L821 177.1 Q821 172.3 825.8 172.3 L912 172.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M991.6 210.8 L991.6 323.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M1092.4 323.8 L1092.4 210.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M912 371.8 L825.8 371.8 Q821 371.8 821 367.1 L821 367.1 Q821 362.3 816.2 362.3 L730 362.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M1042 419.8 L1042 513.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="137.8" width="252" height="69" rx="10" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="32" y="145.8" width="4" height="53" rx="2" fill="#94A3B8"/>
