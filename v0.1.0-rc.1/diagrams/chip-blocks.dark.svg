<text x="80" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">FDO2</text>
<text x="129.3" y="162.8" font-size="12" fill="#E2E8F0">Module, 4-pin</text>
<text x="124" y="228.6" font-size="15" font-weight="700" fill="#FDE68A">LED, detector and</text>
<text x="124" y="248.1" font-size="15" font-weight="700" fill="#FDE68A">sensing membrane*</text>
<text x="124" y="272.9" font-size="13" fill="#D2DAE4">red excitation, near</text>
<text x="124" y="291.8" font-size="13" fill="#D2DAE4">infrared luminescence</text>
<text x="124" y="388.6" font-size="15" font-weight="700" fill="#A7F3E6">Temperature,</text>
<text x="124" y="408.1" font-size="15" font-weight="700" fill="#A7F3E6">pressure and</text>
<text x="124" y="427.6" font-size="15" font-weight="700" fill="#A7F3E6">humidity sensors*</text>
<text x="124" y="452.4" font-size="13" fill="#D2DAE4">inside the housing, vent</text>
<text x="124" y="471.3" font-size="13" fill="#D2DAE4">capillary</text>
<text x="492" y="228.6" font-size="15" font-weight="700" fill="#E2E8F0">Module controller*</text>
<text x="492" y="253.4" font-size="13" fill="#D2DAE4">phase to pO2, status,</text>
<text x="492" y="272.2" font-size="13" fill="#D2DAE4">calibration, flash</text>
<text x="492" y="388.6" font-size="15" font-weight="700" fill="#E2E8F0">Flash*</text>
<text x="492" y="413.4" font-size="13" fill="#D2DAE4">calibration, settings, 64</text>
<text x="492" y="432.3" font-size="13" fill="#D2DAE4">user words</text>
<text x="860" y="228.6" font-size="15" font-weight="700" fill="#A7F3E6">UART</text>
<text x="860" y="253.4" font-size="13" fill="#D2DAE4">19200 8N1 at power-up,</text>
<text x="860" y="272.2" font-size="13" fill="#D2DAE4">3.0 V, CR lines</text>
<text x="860" y="388.6" font-size="15" font-weight="700" fill="#E2E8F0">Supply</text>
<text x="860" y="413.4" font-size="13" fill="#D2DAE4">3.3 V to 5.0 V</text>
<text x="1102" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">TXD  2</text>
<text x="1102" y="270.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">RXD  3</text>
<text x="1102" y="414.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">VCC  4</text>
<text x="1102" y="438.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">GND  1</text>
