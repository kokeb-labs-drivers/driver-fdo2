<text x="32" y="543.8" font-size="12.5" fill="#9AA6B5">* Not confirmed in the datasheet: LED, detector and sensing membrane: the data sheets have no block diagram; described in sections 1 and 4 text; Temperature, pressure and</text>
<text x="32" y="561.8" font-size="12.5" fill="#9AA6B5">humidity sensors: the data sheets have no block diagram; described in sections 1 and 2 text; Module controller: the data sheets have no block diagram; Flash: the data sheets have</text>
<text x="32" y="579.8" font-size="12.5" fill="#9AA6B5">no block diagram.</text>
