<path d="M730 181.8 L816.2 181.8 Q821 181.8 821 177.1 L821 177.1 Q821 172.3 825.8 172.3 L912 172.3" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M991.6 210.8 L991.6 323.8" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M1092.4 323.8 L1092.4 210.8" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M912 371.8 L825.8 371.8 Q821 371.8 821 367.1 L821 367.1 Q821 362.3 816.2 362.3 L730 362.3" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M1042 419.8 L1042 513.8" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="137.8" width="252" height="69" rx="10" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="32" y="145.8" width="4" height="53" rx="2" fill="#64748B"/>
<rect x="474" y="137.8" width="252" height="88" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="474" y="145.8" width="4" height="72" rx="2" fill="#9A4A17"/>
<rect x="916" y="137.8" width="252" height="69" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="916" y="145.8" width="4" height="53" rx="2" fill="#0B7A72"/>
<rect x="916" y="327.8" width="252" height="88" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="916" y="335.8" width="4" height="72" rx="2" fill="#9A4A17"/>
<rect x="32" y="327.8" width="252" height="88" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="335.8" width="4" height="72" rx="2" fill="#0B7A72"/>
<rect x="474" y="327.8" width="252" height="69" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="474" y="335.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="916" y="517.8" width="252" height="88" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<rect x="916" y="525.8" width="4" height="72" rx="2" fill="#DB2752"/>
<rect x="32" y="517.8" width="844" height="60.5" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#334155">Uninitialized</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">nothing started, or Deinitialize()</text>
<text x="494" y="164.6" font-size="15" font-weight="700" fill="#7A360E">PoweringUp</text>
<text x="494" y="189.4" font-size="13" fill="#2B3442">waits power_up_ms, then #VERS</text>
<text x="494" y="208.2" font-size="13" fill="#2B3442">and #IDNR</text>
<text x="936" y="164.6" font-size="15" font-weight="700" fill="#0B5F59">Idle</text>
<text x="936" y="189.4" font-size="13" fill="#2B3442">ready for a call</text>
<text x="936" y="354.6" font-size="15" font-weight="700" fill="#7A360E">Waiting</text>
<text x="936" y="379.4" font-size="13" fill="#2B3442">one command in flight, Poll()</text>
<text x="936" y="398.3" font-size="13" fill="#2B3442">reads the reply</text>
<text x="52" y="354.6" font-size="15" font-weight="700" fill="#0B5F59">Streaming</text>
<text x="52" y="379.4" font-size="13" fill="#2B3442">Idle while the module sends</text>
<text x="52" y="398.3" font-size="13" fill="#2B3442">#MRAW lines by itself</text>
<text x="494" y="354.6" font-size="15" font-weight="700" fill="#8A3C0B">Draining</text>
<text x="494" y="379.4" font-size="13" fill="#2B3442">discards input after a bad reply</text>
<text x="936" y="544.5" font-size="15" font-weight="700" fill="#9F1239">StateUnknown</text>
<text x="936" y="569.4" font-size="13" fill="#2B3442">a flash write or #BAUD lost its</text>
<text x="936" y="588.2" font-size="13" fill="#2B3442">echo</text>
<rect x="326" y="167.1" width="106" height="20" rx="10" fill="#FFFFFF"/>
<text x="379" y="181.4" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">BeginInitialize()</text>
<rect x="762.3" y="167.1" width="117.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="821" y="181.4" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">#VERS, #IDNR ok</text>
<rect x="963.1" y="257.3" width="57" height="20" rx="10" fill="#FFFFFF"/>
<text x="991.6" y="271.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Start*()</text>
<rect x="1071" y="257.3" width="42.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="1092.4" y="271.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">reply</text>
<rect x="775.6" y="357.1" width="90.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="821" y="371.4" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Timeout, Crc</text>
<rect x="1011.6" y="456.8" width="60.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="1042" y="471.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">no echo</text>
<text x="46" y="544.5" font-size="15" font-weight="700" fill="#8A3C0B">Recovery</text>
<text x="46" y="562.4" font-size="13" fill="#8A3C0B">Resync() leaves StateUnknown: it reads #VERS at the new, the old and the default baud rate.</text>
<rect x="32" y="621.2" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="54" y="632.8" font-size="12.5" fill="#566070">normal path</text>
<rect x="152.5" y="621.2" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="174.5" y="632.8" font-size="12.5" fill="#566070">needs recovery</text>
<path d="M296.4 627.4L326.4 627.4" fill="none" stroke="#8893A2" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="340.4" y="632.8" font-size="12.5" fill="#566070">moves to</text>
</svg>
