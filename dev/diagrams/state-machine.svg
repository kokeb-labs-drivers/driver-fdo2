<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="667" viewBox="0 0 1200 667" role="img" aria-labelledby="state-machine-title state-machine-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="state-machine-title">The driver's states</title>
<desc id="state-machine-desc">State diagram of fdo2::FDO2: Uninitialized, PoweringUp, Idle, Waiting, Streaming, Draining and StateUnknown, with the calls and events that move between them.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="666" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">NON-BLOCKING USE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">The driver's states</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Poll() moves Waiting, Draining and PoweringUp forward; every other change is a call.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
