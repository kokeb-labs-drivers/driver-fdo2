<text x="80" y="162.8" font-size="13" font-weight="700" fill="#334155">FDO2</text>
<text x="129.3" y="162.8" font-size="12" fill="#334155">Module, 4-pin</text>
<text x="124" y="228.6" font-size="15" font-weight="700" fill="#8A3C0B">LED, detector and</text>
<text x="124" y="248.1" font-size="15" font-weight="700" fill="#8A3C0B">sensing membrane*</text>
<text x="124" y="272.9" font-size="13" fill="#2B3442">red excitation, near</text>
<text x="124" y="291.8" font-size="13" fill="#2B3442">infrared luminescence</text>
<text x="124" y="388.6" font-size="15" font-weight="700" fill="#0B5F59">Temperature,</text>
<text x="124" y="408.1" font-size="15" font-weight="700" fill="#0B5F59">pressure and</text>
<text x="124" y="427.6" font-size="15" font-weight="700" fill="#0B5F59">humidity sensors*</text>
<text x="124" y="452.4" font-size="13" fill="#2B3442">inside the housing, vent</text>
<text x="124" y="471.3" font-size="13" fill="#2B3442">capillary</text>
<text x="492" y="228.6" font-size="15" font-weight="700" fill="#334155">Module controller*</text>
<text x="492" y="253.4" font-size="13" fill="#2B3442">phase to pO2, status,</text>
<text x="492" y="272.2" font-size="13" fill="#2B3442">calibration, flash</text>
<text x="492" y="388.6" font-size="15" font-weight="700" fill="#334155">Flash*</text>
<text x="492" y="413.4" font-size="13" fill="#2B3442">calibration, settings, 64</text>
<text x="492" y="432.3" font-size="13" fill="#2B3442">user words</text>
<text x="860" y="228.6" font-size="15" font-weight="700" fill="#0B5F59">UART</text>
<text x="860" y="253.4" font-size="13" fill="#2B3442">19200 8N1 at power-up,</text>
<text x="860" y="272.2" font-size="13" fill="#2B3442">3.0 V, CR lines</text>
<text x="860" y="388.6" font-size="15" font-weight="700" fill="#334155">Supply</text>
<text x="860" y="413.4" font-size="13" fill="#2B3442">3.3 V to 5.0 V</text>
<text x="1102" y="246.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">TXD  2</text>
<text x="1102" y="270.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">RXD  3</text>
<text x="1102" y="414.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VCC  4</text>
<text x="1102" y="438.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">GND  1</text>
