<text x="364.8" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">8 data bits, no parity</text>
<text x="542.7" y="207.9" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">stop</text>
<text x="32" y="256.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">TXD</text>
