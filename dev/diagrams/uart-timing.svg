<title id="uart-timing-title">UART character</title>
<desc id="uart-timing-desc">One UART character of the FDO2-G2 at its power-up settings: a start bit, eight data bits least significant first, no parity and one stop bit at 19200 bit/s on 3.0 V levels.</desc>
