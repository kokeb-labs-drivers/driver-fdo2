<text x="384.5" y="255.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">D4</text>
<text x="424.1" y="255.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">D5</text>
<text x="463.6" y="255.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">D6</text>
<text x="503.2" y="255.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">D7</text>
<text x="32" y="299.3" font-size="17" font-weight="700" fill="#0E1726">Timing values</text>
<text x="32" y="335.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">baud</text>
<text x="608" y="335.7" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">typ 19200 bit/s</text>
<text x="32" y="355.9" font-size="15" fill="#2B3442">Bit rate after every power-up</text>
<text x="32" y="376.1" font-size="14" fill="#566070">Datasheet 4 Communication Interface, p. 10</text>
<text x="32" y="408.5" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">baud</text>
<text x="608" y="408.5" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 1200 · max 115200 bit/s</text>
<text x="32" y="428.8" font-size="15" fill="#2B3442">Bit rates #BAUD sets (eleven rates from 1200 to 115200)</text>
<text x="32" y="448.9" font-size="14" fill="#566070">Datasheet 4.3 Commands, #BAUD, p. 14</text>
<text x="32" y="481.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tPU</text>
<text x="608" y="481.4" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">typ 1 s</text>
<text x="32" y="501.7" font-size="15" fill="#2B3442">Power-up time before the module responds to commands</text>
<text x="32" y="521.8" font-size="14" fill="#566070">Datasheet 4 Communication Interface, p. 10</text>
<text x="32" y="554.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VIO</text>
<text x="608" y="554.2" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">typ 3 V</text>
<text x="32" y="574.5" font-size="15" fill="#2B3442">UART level (absolute maximum 3.3 V)</text>
<text x="32" y="594.7" font-size="14" fill="#566070">Datasheet 2 Specifications, Interface, p. 6</text>
<text x="46" y="648.8" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="669.2" font-size="15" fill="#334155">Power-up settings: 19200 baud, 8 data bits, 1 stop bit, no parity, no</text>
<text x="46" y="691" font-size="15" fill="#334155">handshake.</text>
