<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">UART character</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Datasheet: 4 Communication Interface, p. 10; 4.3 Commands, #BAUD, p. 14;</text>
<text x="32" y="124.5" font-size="15" fill="#566070">2 Specifications, Interface, p. 6.</text>
