<text x="32" y="224.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">TXD</text>
<text x="155.6" y="223.7" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">#MOXY</text>
<text x="223.3" y="223.7" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">CR</text>
<text x="290.9" y="253.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">tMEAS</text>
<text x="32" y="306.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">RXD</text>
<text x="372.1" y="305.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">#MOXY</text>
<text x="426.2" y="305.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">O</text>
<text x="453.2" y="305.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">T</text>
<text x="493.8" y="305.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">S</text>
<text x="547.9" y="305.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">CR</text>
<text x="32" y="349.3" font-size="17" font-weight="700" class="fk-f-ink">Values</text>
<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tMEAS</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 150 ms</text>
<text x="32" y="405.9" font-size="15" class="fk-f-ink2">Complete measurement in the default mode M=2 (modes 3 and 4: about</text>
<text x="32" y="426.9" font-size="15" class="fk-f-ink2">300 ms)</text>
<text x="32" y="447.1" font-size="14" class="fk-f-muted">Datasheet 4.3 Commands, #SETM, modes, p. 16</text>
<text x="46" y="501.2" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="521.7" font-size="15" class="fk-f-slate-text">A command ends with a carriage return (0x0D), or a carriage return and</text>
<text x="46" y="543.4" font-size="15" class="fk-f-slate-text">a line feed (0x0D, 0x0A). The reply is the echo of the command with the</text>
<text x="46" y="565.2" font-size="15" class="fk-f-slate-text">values and one carriage return (0x0D). With CRC enabled the reply ends</text>
<text x="46" y="586.9" font-size="15" class="fk-f-slate-text">with a colon, a space and the CRC16 checksum before the carriage</text>
<text x="46" y="608.7" font-size="15" class="fk-f-slate-text">return.</text>
