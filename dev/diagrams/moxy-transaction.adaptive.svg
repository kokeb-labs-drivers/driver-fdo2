<svg xmlns="http://www.w3.org/2000/svg" width="640" height="655" viewBox="0 0 640 655" role="img" aria-labelledby="moxy-transaction-title moxy-transaction-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="moxy-transaction-title">One oxygen measurement</title>
<desc id="moxy-transaction-desc">One #MOXY exchange with the FDO2-G2: the host sends the command and a carriage return, the module measures, then echoes the command with the oxygen, temperature and status values and a carriage return.</desc>
