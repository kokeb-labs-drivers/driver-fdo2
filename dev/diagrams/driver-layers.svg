<text x="48" y="331.4" font-size="17" font-weight="700" fill="#7A360E">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#7A360E">FDO2, inc/fdo2.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="853.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="884.2" font-size="17" fill="#2B3442">UartInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="1006.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="1035.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Write()  Read()  FlushInput()</text>
<text x="56" y="1158.6" font-size="20" font-weight="700" fill="#334155">FDO2</text>
<text x="56" y="1189.2" font-size="17" fill="#2B3442">the chip, on the UART bus</text>
<rect x="322.9" y="774.6" width="214.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="792.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">register reads and writes</text>
<rect x="329.6" y="927.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="945.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="361.7" y="1079.6" width="136.5" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="1097.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">UART transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="1006.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="1030.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="1054.7" font-size="17" fill="#0B5F59">board.</text>
