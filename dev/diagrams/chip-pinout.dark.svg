<svg xmlns="http://www.w3.org/2000/svg" width="921" height="441" viewBox="0 0 921 441" role="img" aria-labelledby="chip-pinout-title chip-pinout-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-pinout-title">FDO2 pinout, Module, 4-pin</title>
<desc id="chip-pinout-desc">Pinout of the FDO2 in Module, 4-pin, top view: 4 pins, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
