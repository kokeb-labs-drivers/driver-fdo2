<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port hook the driver uses</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">for it. Datasheet: 7 Mechanical Dimensions and Electrical Interface, drawing and pin table, p. 20.</text>
