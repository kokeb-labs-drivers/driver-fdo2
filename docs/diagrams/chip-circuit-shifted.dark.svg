<svg xmlns="http://www.w3.org/2000/svg" width="800" height="716" viewBox="0 0 800 716" role="img" aria-labelledby="chip-circuit-shifted-title chip-circuit-shifted-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-shifted-title">FDO2: Connection to a 5-volt controller through a divider</title>
<desc id="chip-circuit-shifted-desc">Schematic of the FDO2 connection to a 5-volt controller through a divider: the chip with U2 MCU (5 V), R1 resistor 10 kΩ, R2 resistor 12 kΩ, C1 capacitor 100 nF; the MCU wires carry the port hooks GpioSet(CtrlPin::Power), Read(), Write().</desc>
<rect x="0.5" y="0.5" width="799" height="715" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">FDO2: Connection to a 5-volt controller through a divider</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">RXD tolerates 3.3 V at most (data sheet, absolute maximum rating): a controller with 5 V outputs</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">needs a divider or a level shifter in front of RXD. The divider gives R2 / (R1 + R2) of the</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">controller's output: 10 kΩ and 12 kΩ give 0.545, so 2.7 V from 5.0 V and 3.0 V from 5.5 V, and 3.03</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">V at most with 1 % resistors, below the 3.3 V maximum. A ratio above 0.6 puts more than 3.3 V on</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">RXD at 5.5 V (10 kΩ and 20 kΩ give 3.67 V). TXD swings to 3.0 V only: connect it straight to a</text>
<text x="32" y="212.6" font-size="15" fill="#9AA6B5">controller input that reads 3.0 V as high (a CMOS input at 0.7 x VDD of a 5 V controller does not;</text>
<text x="32" y="234.3" font-size="15" fill="#9AA6B5">use a level shifter for TXD as well). Above each MCU wire: the port hook that drives it. Datasheet:</text>
<text x="32" y="256.1" font-size="15" fill="#9AA6B5">6.2 Voltage Tolerance of UART RX Pin (ERRATA), p. 19.</text>
