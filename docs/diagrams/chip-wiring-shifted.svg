<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" role="img" aria-labelledby="chip-wiring-shifted-title chip-wiring-shifted-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-shifted-title">Wiring: Connection to a 5-volt controller through a divider</title>
<desc id="chip-wiring-shifted-desc">Wiring of the FDO2 for the Connection to a 5-volt controller through a divider: MCU (5 V) UART RX to TXD (Read()); MCU (5 V) UART TX to RXD through R1 10 kΩ (Write()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="741" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Connection to a 5-volt controller through a divider</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: 6.2 Voltage Tolerance of UART RX Pin (ERRATA), p. 19.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M465.4 280.3 L680.6 280.3" fill="none" stroke="#15803D" stroke-width="2.2"/>
<path d="M465.4 365.9 L680.6 365.9" fill="none" stroke="#0B7A72" stroke-width="2.2"/>
<rect x="694.6" y="175.5" width="240" height="251.2" rx="10" fill="#F5F7FA" stroke="#2B3442" stroke-width="2.2"/>
<rect x="265.4" y="175.5" width="200" height="251.2" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="454.7" width="1136" height="79" rx="12" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<rect x="32" y="547.7" width="1136" height="79" rx="12" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="814.6" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">FDO2</text>
<text x="814.6" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="283.4" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU (5 V)</text>
<text x="283.4" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="447.4" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">UART RX</text>
<text x="716.6" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">TXD</text>
<rect x="680.6" y="274.3" width="14" height="12" rx="2" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">TXD to MCU RX  pin 2</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Read()</text>
<text x="447.4" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">UART TX</text>
<text x="716.6" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">RXD</text>
<rect x="680.6" y="359.9" width="14" height="12" rx="2" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="573" y="355.9" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">RXD  pin 3</text>
<text x="573" y="388.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write()</text>
<text x="573" y="410.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">through R1 10 kΩ</text>
<text x="573" y="431.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R2 12 kΩ</text>
<text x="50" y="489.7" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="513.1" font-size="17" fill="#9F1239">+5V: VCC; also U2.VDD · GND: GND; also U2.GND</text>
<text x="50" y="582.7" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="606.1" font-size="17" fill="#334155">Support parts: 1 capacitor, 2 resistors around the supplies (values in the full schematic).</text>
<text x="32" y="652.2" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: example value: with R2 it gives 3.0 V from 5.5 V, below the 3.3 V maximum; R2: example value: keep R2</text>
<text x="32" y="675.2" font-size="16" fill="#566070">/ (R1 + R2) at 0.6 or less; C1: a common practice, not a data sheet value.</text>
<rect x="32" y="692.4" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="707" font-size="16" fill="#566070">digital in</text>
<rect x="145.1" y="692.4" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="167.1" y="707" font-size="16" fill="#566070">digital out</text>
</svg>
