<text x="182.7" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">command</text>
<text x="453.2" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">echo and values</text>
<text x="32" y="224.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">TXD</text>
<text x="155.6" y="223.7" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">#MOXY</text>
<text x="223.3" y="223.7" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">CR</text>
<text x="290.9" y="253.9" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">tMEAS</text>
<text x="32" y="306.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">RXD</text>
<text x="372.1" y="305.9" font-size="14" font-weight="600" text-anchor="middle" fill="#0B5F59">#MOXY</text>
<text x="426.2" y="305.9" font-size="14" font-weight="600" text-anchor="middle" fill="#0B5F59">O</text>
<text x="453.2" y="305.9" font-size="14" font-weight="600" text-anchor="middle" fill="#0B5F59">T</text>
<text x="493.8" y="305.9" font-size="14" font-weight="600" text-anchor="middle" fill="#0B5F59">S</text>
<text x="547.9" y="305.9" font-size="14" font-weight="600" text-anchor="middle" fill="#0B5F59">CR</text>
<text x="32" y="349.3" font-size="17" font-weight="700" fill="#0E1726">Values</text>
<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tMEAS</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">max 150 ms</text>
<text x="32" y="405.9" font-size="15" fill="#2B3442">Complete measurement in the default mode M=2 (modes 3 and 4: about</text>
<text x="32" y="426.9" font-size="15" fill="#2B3442">300 ms)</text>
<text x="32" y="447.1" font-size="14" fill="#566070">Datasheet 4.3 Commands, #SETM, modes, p. 16</text>
<text x="46" y="501.2" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="521.7" font-size="15" fill="#334155">A command ends with a carriage return (0x0D), or a carriage return and</text>
<text x="46" y="543.4" font-size="15" fill="#334155">a line feed (0x0D, 0x0A). The reply is the echo of the command with the</text>
<text x="46" y="565.2" font-size="15" fill="#334155">values and one carriage return (0x0D). With CRC enabled the reply ends</text>
<text x="46" y="586.9" font-size="15" fill="#334155">with a colon, a space and the CRC16 checksum before the carriage</text>
<text x="46" y="608.7" font-size="15" fill="#334155">return.</text>
</svg>
