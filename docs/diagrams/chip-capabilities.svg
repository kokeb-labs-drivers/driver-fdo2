<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="932" viewBox="0 0 1200 932" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the FDO2 does</title>
<desc id="chip-capabilities-desc">Capability map of the FDO2: Oxygen and temperature (supported): Measures the oxygen partial pressure and the temperature, as hPa or as a volume fraction; Raw values and housing sensors (supported): Adds the phase shift, signal and ambient light, and the pressure and humidity inside the housing; Status word (supported): Classifies each reading's warning and fatal bits and holds back a faulty measurement; Identity and start-up (supported): Waits out the power-up, reads the version and the unique ID, and flashes the status LED to find a module; Calibration (guarded): Calibrates at zero oxygen, at a known partial pressure or in dry air; the factory calibration is lost; Broadcast stream (guarded): Makes the module measure by itself at a set interval and send each result; Measurement mode, CRC and baud rate (guarded): Trades drift for noise, adds a CRC-16 to every reply, and changes the baud rate; User memory (guarded): Reads and writes 64 words that survive a power cycle; each write costs a flash cycle.</desc>
