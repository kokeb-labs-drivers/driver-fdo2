<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="819" viewBox="0 0 1200 819" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">FDO2</title>
<desc id="chip-hero-desc">Overview of the FDO2, an optical oxygen sensor module with a UART: it excites a sensor dye with red light, measures the luminescence that oxygen quenches, and reports the oxygen partial pressure with its temperature, compensated and factory calibrated. A MCU talks to it over UART, 3.0 V; it reads back Oxygen, Temperature, pressure, humidity. Headline figures: 0 to 1000 hPa typical oxygen partial pressure range; &lt; 2 s response time (t63); 3.3 to 5.0 V supply; 19200 baud UART at power-up, 8N1, 3.0 V.</desc>
