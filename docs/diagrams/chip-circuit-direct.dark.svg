<svg xmlns="http://www.w3.org/2000/svg" width="760" height="599" viewBox="0 0 760 599" role="img" aria-labelledby="chip-circuit-direct-title chip-circuit-direct-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-direct-title">FDO2: Direct connection to a 3.3-volt controller</title>
<desc id="chip-circuit-direct-desc">Schematic of the FDO2 direct connection to a 3.3-volt controller: the chip with U2 MCU (3.3 V), C1 capacitor 100 nF; the MCU wires carry the port hooks GpioSet(CtrlPin::Power), Read(), Write().</desc>
<rect x="0.5" y="0.5" width="759" height="598" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">FDO2: Direct connection to a 3.3-volt controller</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The module's TXD goes to the controller's UART RX and its RXD to the controller's UART</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">TX; both are 3.0 V signals, so a 3.3 V controller connects directly. The 100 nF capacitor at</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">VCC is common practice, not a data sheet value. The supply may be 3.3 V or 5.0 V. Above</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">each MCU wire: the port hook that drives it. Datasheet: 7 Mechanical Dimensions and</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">Electrical Interface, drawing and pin table, p. 20.</text>
