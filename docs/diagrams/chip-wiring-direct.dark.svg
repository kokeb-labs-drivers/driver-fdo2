<text x="50" y="469.9" font-size="17" fill="#FECDD3">+3V3: VCC; also U2.VDD · GND: GND; also U2.GND</text>
<text x="50" y="539.5" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
