---
kind: timing
id: uart-timing
title: UART character
kicker: On the bus
alt: >-
  One UART character of the FDO2-G2 at its power-up settings: a start bit, eight data bits least significant first,
  no parity and one stop bit at 19200 bit/s on 3.0 V levels.
reads: >-
  The lane is TXD, left to right in time, and RXD carries the same format in the other direction. The line idles
  high, the start bit pulls it low for one bit time, the data bits D0 to D7 follow and the stop bit returns it high.
  The table gives the power-up bit rate, the range the #BAUD command sets and the power-up time before the first
  command.
bus: uart
refs:
  uart: {doc: ds, section: "4 Communication Interface", page: 10}
  baudcmd: {doc: ds, section: "4.3 Commands, #BAUD", page: 14}
  spec: {doc: ds, section: "2 Specifications, Interface", page: 6}
signals:
  - {id: txd, label: TXD, wave: "110========11", data: [D0, D1, D2, D3, D4, D5, D6, D7]}
groups:
  - {from: 2, to: 3, label: start}
  - {from: 3, to: 11, label: "8 data bits, no parity", ref: uart}
  - {from: 11, to: 12, label: stop}
params:
  - {id: baud, symbol: baud, label: Bit rate after every power-up, typ: 19200, unit: bit/s, ref: uart}
  - {id: baud-range, symbol: baud, label: "Bit rates #BAUD sets (eleven rates from 1200 to 115200)", min: 1200,
     max: 115200, unit: bit/s, ref: baudcmd}
  - {id: tpu, symbol: tPU, label: Power-up time before the module responds to commands, typ: 1, unit: s, ref: uart}
  - {id: vio, symbol: VIO, label: "UART level (absolute maximum 3.3 V)", typ: 3.0, unit: V, ref: spec}
notes:
  - {text: "Power-up settings: 19200 baud, 8 data bits, 1 stop bit, no parity, no handshake.", ref: uart}
